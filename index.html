<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixlink — Image to Link</title>
<style>
  :root{
    --paper:#0f1115;
    --panel:#171a21;
    --panel-soft:#1e222b;
    --line:#2a2f3a;
    --ink:#eef1f6;
    --ink-soft:#9aa4b6;
    --accent:#ffb648;
    --accent-ink:#1a1305;
    --success:#4fd188;
    --danger:#ff6b6b;
    --danger-bg:#2a1414;
    --success-bg:#122a20;
    --radius:14px;
    font-family:"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #23283a 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #2a1f18 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 24px;
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:9px;
    font-weight:700;
    font-size:17px;
    letter-spacing:-0.01em;
  }
  .brand-mark{
    width:26px;height:26px;
    border-radius:8px;
    background:linear-gradient(135deg, var(--accent), #ff7a4d);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;
    color:var(--accent-ink);
    font-weight:800;
  }
  .tag{
    font-size:12.5px;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:5px 10px;
    border-radius:999px;
  }

  main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:36px 16px 60px;
  }

  .stage{
    width:100%;
    max-width:430px;
  }

  .eyebrow-block{
    text-align:center;
    margin-bottom:26px;
  }
  h1{
    font-size:28px;
    line-height:1.15;
    margin:0 0 8px;
    font-weight:700;
    letter-spacing:-0.015em;
  }
  h1 em{
    font-style:normal;
    color:var(--accent);
  }
  .lede{
    color:var(--ink-soft);
    font-size:14.5px;
    margin:0;
    max-width:34ch;
    margin-inline:auto;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:22px;
  }

  .dropzone{
    display:block;
    border:1.5px dashed #3a4051;
    border-radius:var(--radius);
    padding:30px 18px;
    text-align:center;
    cursor:pointer;
    background:var(--panel-soft);
    transition:border-color .15s ease, background .15s ease;
  }
  .dropzone:hover, .dropzone.drag{
    border-color:var(--accent);
    background:#232838;
  }
  .dropzone svg{
    width:26px;height:26px;
    stroke:var(--accent);
    margin-bottom:10px;
  }
  .dropzone .primary{
    display:block;
    color:var(--ink);
    font-weight:600;
    font-size:15px;
  }
  .dropzone .secondary{
    display:block;
    color:var(--ink-soft);
    font-size:12.5px;
    margin-top:4px;
  }
  input[type=file]{
    position:absolute;
    width:1px;height:1px;
    opacity:0;
    overflow:hidden;
    clip:rect(0 0 0 0);
  }

  .preview-wrap{
    margin-top:16px;
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--panel-soft);
    border:1px solid var(--line);
    max-height:0;
    opacity:0;
    transition:max-height .35s ease, opacity .3s ease, margin-top .35s ease;
  }
  .preview-wrap.show{
    max-height:420px;
    opacity:1;
  }
  .preview-head{
    display:none;
  }
  .preview-head button{
    background:none;
    border:none;
    color:var(--ink-soft);
    font-size:12.5px;
    cursor:pointer;
    text-decoration:underline;
    padding:0;
  }
  .preview-wrap img{
    display:block;
    width:100%;
    max-height:300px;
    object-fit:contain;
    background:#0c0e13;
  }

  .action-btn{
    width:100%;
    margin-top:16px;
    border:none;
    border-radius:var(--radius);
    padding:14px 18px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
    color:var(--accent-ink);
    background:var(--accent);
    transition:transform .12s ease, opacity .2s ease, background .2s ease;
  }
  .action-btn:active{ transform:translateY(1px); }
  .action-btn:disabled{
    cursor:default;
    opacity:.55;
  }
  .action-btn.success{
    background:var(--success);
  }
  .action-btn.error{
    background:var(--danger);
    color:#2a0a0a;
  }

  .link-row{
    margin-top:16px;
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:11px 13px;
    background:var(--panel-soft);
  }
  .link-row .dot{
    width:7px;height:7px;
    border-radius:50%;
    background:var(--success);
    flex:none;
  }
  .link-row input{
    flex:1;
    border:none;
    background:transparent;
    outline:none;
    font-size:13.5px;
    color:var(--ink-soft);
    min-width:0;
    font-family:"SFMono-Regular",Consolas,monospace;
  }

  .copy-btn{
    width:100%;
    margin-top:10px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:13px 18px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    color:var(--ink);
    background:transparent;
    transition:background .18s ease, border-color .18s ease, color .18s ease;
  }
  .copy-btn:active{ transform:translateY(1px); }
  .copy-btn.copied{
    background:var(--success-bg);
    border-color:var(--success);
    color:var(--success);
  }

  .error-msg{
    margin-top:12px;
    padding:11px 13px;
    border-radius:var(--radius);
    background:var(--danger-bg);
    color:var(--danger);
    font-size:13px;
  }

  footer{
    text-align:center;
    padding:16px;
    font-size:12px;
    color:#5c6376;
  }

  @media (prefers-reduced-motion: reduce){
    .preview-wrap, .action-btn, .copy-btn{ transition:none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark">P</span>
    Pixlink
  </div>
  <span class="tag">no need to login</span>
</header>

<main>
  <div class="stage">
    <div class="eyebrow-block">
      <h1>Drop an image<br>get a <em>direct link</em></h1>
      <p class="lede">POWER BY ANIME WORLD</p>
    </div>

    <div class="card">
      <label class="dropzone" id="dropzone" for="fileInput">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"></path>
          <path d="M6 10l6-6 6 6"></path>
          <path d="M4 20h16"></path>
        </svg>
        <span class="primary">Tap to choose an image</span>
        <span class="secondary">or drag one in — JPG, PNG, GIF, WebP</span>
      </label>
      <input type="file" id="fileInput" accept="image/*">

      <div class="preview-wrap" id="previewWrap">
        <div class="preview-head">
          <span id="fileMeta">—</span>
          <button type="button" id="clearBtn">Remove</button>
        </div>
        <img id="previewImg" alt="Selected preview">
      </div>

      <button class="action-btn" id="actionBtn" disabled>Upload image</button>

      <div id="resultArea"></div>
    </div>
  </div>
</main>

<footer>© 2026 Pixlink · All rights reserved.
© 2026 Pixlink Inc.
Pixlink © 2026</footer>

<script>

const IMGBB_API_KEY = "e62143b441d12f15952ef85263064053";
/* ============================================================ */

(function(){
  const dropzone    = document.getElementById('dropzone');
  const fileInput   = document.getElementById('fileInput');
  const previewWrap = document.getElementById('previewWrap');
  const previewImg  = document.getElementById('previewImg');
  const fileMeta    = document.getElementById('fileMeta');
  const clearBtn    = document.getElementById('clearBtn');
  const actionBtn   = document.getElementById('actionBtn');
  const resultArea  = document.getElementById('resultArea');

  let currentObjectUrl = null;

  // Tapping the <label for="fileInput"> opens the native file manager/gallery
  // directly — no extra JS click() call needed.

  dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
  dropzone.addEventListener('drop', e => {
    e.preventDefault();
    dropzone.classList.remove('drag');
    if (e.dataTransfer.files && e.dataTransfer.files[0]) {
      handleFile(e.dataTransfer.files[0]);
    }
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files && fileInput.files[0]) handleFile(fileInput.files[0]);
  });

  clearBtn.addEventListener('click', resetAll);

  function handleFile(file){
    if (!file.type.startsWith('image/')) return;

    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = URL.createObjectURL(file);

    previewImg.src = currentObjectUrl;
    fileMeta.textContent = `${file.name} · ${formatSize(file.size)}`;
    previewWrap.classList.add('show');

    actionBtn.disabled = false;
    actionBtn.classList.remove('success', 'error');
    actionBtn.textContent = 'Upload image';
    actionBtn.onclick = () => uploadImage(file);

    resultArea.innerHTML = '';
  }

  function resetAll(){
    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = null;
    fileInput.value = '';
    previewWrap.classList.remove('show');
    actionBtn.disabled = true;
    actionBtn.classList.remove('success', 'error');
    actionBtn.textContent = 'Upload image';
    resultArea.innerHTML = '';
  }

  function formatSize(bytes){
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + ' KB';
    return (bytes/(1024*1024)).toFixed(1) + ' MB';
  }

  async function uploadImage(file){
    actionBtn.disabled = true;
    actionBtn.classList.remove('success', 'error');
    actionBtn.textContent = 'Uploading…';
    resultArea.innerHTML = '';

    try {
      const formData = new FormData();
      formData.append('image', file);

      const response = await fetch(
        `https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`,
        { method: 'POST', body: formData }
      );

      const data = await response.json();

      if (!response.ok || !data.success) {
        throw new Error((data.error && data.error.message) || 'Upload failed');
      }

      const link = data.data.url;

      actionBtn.textContent = 'Uploaded';
      actionBtn.classList.add('success');

      resultArea.innerHTML = `
        <div class="link-row">
          <span class="dot"></span>
          <input type="text" id="linkField" readonly value="${link}">
        </div>
        <button class="copy-btn" id="copyBtn">Copy link</button>
      `;
      document.getElementById('copyBtn').addEventListener('click', copyLink);

    } catch (err) {
      actionBtn.textContent = 'Upload failed';
      actionBtn.classList.add('error');
      actionBtn.disabled = false;
      resultArea.innerHTML = `<div class="error-msg">${err.message}</div>`;
    }
  }

  async function copyLink(){
    const btn = document.getElementById('copyBtn');
    const field = document.getElementById('linkField');
    try{
      await navigator.clipboard.writeText(field.value);
    }catch(err){
      field.select();
      document.execCommand('copy');
    }
    btn.textContent = 'Copied';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy link';
      btn.classList.remove('copied');
    }, 1800);
  }
})();
</script>

</body>
</html>
